name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build and publish
    # Every target cross-compiles from this one runner because the build needs no
    # cgo. The previous matrix required a macOS runner for darwin, which is what
    # made the Intel build queue indefinitely (no macos-13 runner) and left tags
    # unpublished.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the version and changelog from tags.
          fetch-depth: 0

      # Releases in this repository are immutable: once a tag publishes, its
      # assets cannot be replaced and re-running the job cannot fix a mistake --
      # goreleaser fails fast with "already exists and is immutable". flake.nix
      # states its version literally, because Nix builds from a source tree with
      # no .git, so it is the one thing that can silently disagree with the tag.
      # Catch that here, before anything becomes permanent.
      - name: Check flake version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          got="$(sed -n 's/^ *version = "\(.*\)";$/\1/p' flake.nix)"
          if [ "$want" != "$got" ]; then
            echo "::error file=flake.nix::flake.nix says $got but the tag is $want. Bump flake.nix and re-tag."
            exit 1
          fi
          echo "flake.nix and tag agree on $want"

      # The cask publishes after the GitHub release, and releases here are
      # immutable, so a tap token that does not work means a release that can
      # never get its cask -- only a new tag can fix it. That is what cost both
      # v0.8.1 and v0.8.2. Validating the credential before anything is
      # published turns that into a recoverable failure: nothing exists yet, so
      # fixing the secret and re-running this job is enough.
      - name: Check the tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Kept in step with the repository under homebrew_casks in
          # .goreleaser.yaml.
          TAP: mondaycom/homebrew-tap
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. It needs a PAT with Contents: read and write on $TAP."
            exit 1
          fi
          # gh puts a one-line summary ("gh: Bad credentials (HTTP 401)") on
          # stderr and the raw JSON body on stdout, so report the former.
          if ! push="$(gh api "repos/$TAP" -q .permissions.push 2>"$RUNNER_TEMP/tap-err")"; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot read $TAP -- $(head -1 "$RUNNER_TEMP/tap-err")"
            echo "::error::HTTP 401 means the token is invalid, expired, or was pasted incompletely; HTTP 404 means it is valid but has no access to that repository."
            exit 1
          fi
          if [ "$push" != "true" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN can read $TAP but cannot push to it. Grant Contents: read and write."
            exit 1
          fi
          echo "tap token can push to $TAP"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on mondaycom/homebrew-tap. The per-run
          # GITHUB_TOKEN is scoped to this repository and cannot push the cask
          # to another one.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
