name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo_enabled: "0"
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cgo_enabled: "0"
          - os: macos-13
            goos: darwin
            goarch: amd64
            cgo_enabled: "1"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo_enabled: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          VERSION=$(git describe --tags --always)
          BINARY=mcli-${{ matrix.goos }}-${{ matrix.goarch }}
          go build \
            -ldflags "-X github.com/mondaycom/mcli/internal/cli.version=${VERSION}" \
            -o "${BINARY}" \
            ./cmd/mcli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mcli-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Checksums
        run: sha256sum dist/mcli-* > dist/checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/mcli-linux-amd64 \
            dist/mcli-linux-arm64 \
            dist/mcli-darwin-amd64 \
            dist/mcli-darwin-arm64 \
            dist/checksums.txt
