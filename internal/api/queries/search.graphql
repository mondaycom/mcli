# SearchItems searches monday.com items by query string.
query SearchItems($query: String!, $limit: Int = 10) {
  search {
    items(query: $query, limit: $limit) {
      results {
        id
        indexed_data {
          id
          name
          url
          board_id
          workspace_id
        }
      }
    }
  }
}

