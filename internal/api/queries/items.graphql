# ItemsListByBoard fetches a page of items from a board (no group filter).
# monday's items_page uses opaque cursor pagination. Pass empty/omitted cursor for
# the first page; the response cursor is null/empty when no more pages.
query ItemsListByBoard(
  $boardId: ID!,
  $limit: Int! = 25,
  # @genqlient(omitempty: true)
  $cursor: String,
) {
  boards(ids: [$boardId]) {
    items_page(limit: $limit, cursor: $cursor) {
      cursor
      items {
        id
        name
        state
        group { id title }
        column_values {
          id
          type
          value
          text
          column { id title settings_str }
        }
      }
    }
  }
}

# ItemsListByGroup fetches a page of items from a specific group within a board.
query ItemsListByGroup(
  $boardId: ID!,
  $groupId: String!,
  $limit: Int! = 25,
  # @genqlient(omitempty: true)
  $cursor: String,
) {
  boards(ids: [$boardId]) {
    groups(ids: [$groupId]) {
      id
      items_page(limit: $limit, cursor: $cursor) {
        cursor
        items {
          id
          name
          state
          group { id title }
          column_values {
            id
            type
            value
            text
            column { id title settings_str }
          }
        }
      }
    }
  }
}

# ItemGet fetches a single item by ID with full detail.
query ItemGet($id: ID!) {
  items(ids: [$id]) {
    id
    name
    state
    created_at
    updated_at
    creator { id name }
    group { id title }
    board { id name }
    parent_item { id name }
    subitems { id name state }
    column_values {
      id
      type
      value
      text
      column { id title settings_str }
    }
  }
}

# ItemCreate creates a top-level item on a board.
mutation ItemCreate(
  $boardId: ID!,
  $name: String!,
  # @genqlient(omitempty: true)
  $groupId: String,
  # @genqlient(omitempty: true)
  $columnValues: JSON,
) {
  create_item(
    board_id: $boardId,
    item_name: $name,
    group_id: $groupId,
    column_values: $columnValues,
  ) {
    id
    name
    state
    group { id title }
    board { id name }
  }
}

# SubitemCreate creates a subitem under a parent item.
mutation SubitemCreate(
  $parentId: ID!,
  $name: String!,
  # @genqlient(omitempty: true)
  $columnValues: JSON,
) {
  create_subitem(
    parent_item_id: $parentId,
    item_name: $name,
    column_values: $columnValues,
  ) {
    id
    name
    state
    parent_item { id name }
    board { id name }
  }
}

# ItemUpdate changes one or more column values on an item.
# Use the column id "name" with value "new name" (bare string) to rename.
mutation ItemUpdate(
  $boardId: ID!,
  $itemId: ID!,
  $columnValues: JSON!,
) {
  change_multiple_column_values(
    board_id: $boardId,
    item_id: $itemId,
    column_values: $columnValues,
  ) {
    id
    name
    state
    board { id name }
    group { id title }
  }
}

# ItemMoveToGroup moves an item to a different group within the same board.
mutation ItemMoveToGroup(
  $itemId: ID,
  $groupId: String!,
) {
  move_item_to_group(
    item_id: $itemId,
    group_id: $groupId,
  ) {
    id
    name
    state
    board { id name }
    group { id title }
  }
}

# ItemMoveToBoard moves an item to a different board.
mutation ItemMoveToBoard(
  $itemId: ID!,
  $boardId: ID!,
  $groupId: ID!,
) {
  move_item_to_board(
    item_id: $itemId,
    board_id: $boardId,
    group_id: $groupId,
  ) {
    id
    name
    state
    board { id name }
    group { id title }
  }
}

# ItemDelete permanently deletes an item by ID.
mutation ItemDelete($itemId: ID!) {
  delete_item(item_id: $itemId) {
    id
    name
    state
  }
}

# ItemArchive archives an item by ID.
mutation ItemArchive($itemId: ID!) {
  archive_item(item_id: $itemId) {
    id
    name
    state
  }
}
