# BoardsList fetches a page of boards.
#
# Pagination note: monday.com boards use page/limit (integer page numbers),
# not cursor-based pagination. The CLI surface exposes --cursor as a string
# for API uniformity; the cursor is encoded as the decimal page number. Page 1
# is the first page. When results fill the limit there may be more pages; the
# caller receives the next page number encoded as a string cursor. When fewer
# results than limit are returned, the cursor is empty (no more pages).
# @genqlient(omitempty: true)
query BoardsList($limit: Int, $page: Int, $workspaceIds: [ID]) {
  boards(limit: $limit, page: $page, workspace_ids: $workspaceIds) {
    id
    name
    state
    board_kind
    workspace_id
  }
}

# BoardCreate creates a new board.
mutation BoardCreate(
  $name: String!,
  $kind: BoardKind!,
  # @genqlient(omitempty: true)
  $workspaceId: ID,
  # @genqlient(omitempty: true)
  $description: String,
  # @genqlient(omitempty: true)
  $empty: Boolean,
) {
  create_board(board_name: $name, board_kind: $kind, workspace_id: $workspaceId, description: $description, empty: $empty) {
    id
    name
    state
    board_kind
    workspace_id
    description
  }
}

# BoardGet fetches a single board by ID with full detail.
# When $withItems is true, the first page of items (with column values) is
# fetched in the same round trip; otherwise items_page is skipped so the
# default query cost is unchanged.
query BoardGet(
  $id: ID!,
  $withItems: Boolean! = false,
  $itemsLimit: Int! = 25,
  # @genqlient(omitempty: true)
  $itemsCursor: String,
) {
  boards(ids: [$id]) {
    id
    name
    state
    board_kind
    description
    workspace_id
    workspace {
      id
      name
      kind
    }
    owners {
      id
      name
    }
    groups {
      id
      title
      color
      position
    }
    columns {
      id
      title
      type
      settings_str
      width
      archived
    }
    items_page(limit: $itemsLimit, cursor: $itemsCursor) @include(if: $withItems) {
      cursor
      items {
        id
        name
        state
        group { id title }
        column_values {
          id
          type
          value
          text
          column { id title settings_str }
        }
      }
    }
  }
}

# BoardRename updates the board name attribute.
mutation BoardRename($boardId: ID!, $name: String!) {
  update_board(board_id: $boardId, board_attribute: name, new_value: $name)
}

# BoardDelete deletes a board by ID.
mutation BoardDelete($boardId: ID!) {
  delete_board(board_id: $boardId) {
    id
    name
  }
}

# BoardArchive archives a board by ID.
mutation BoardArchive($boardId: ID!) {
  archive_board(board_id: $boardId) {
    id
    name
  }
}

# BoardGroupList fetches the groups of a board.
query BoardGroupList($boardId: ID!) {
  boards(ids: [$boardId]) {
    id
    groups {
      id
      title
      color
      position
    }
  }
}

# BoardGroupCreate creates a new group in a board.
mutation BoardGroupCreate(
  $boardId: ID!,
  $name: String!,
  # @genqlient(omitempty: true)
  $color: String,
) {
  create_group(board_id: $boardId, group_name: $name, group_color: $color) {
    id
    title
    color
    position
  }
}

# BoardGroupDelete deletes a group from a board.
mutation BoardGroupDelete($boardId: ID!, $groupId: String!) {
  delete_group(board_id: $boardId, group_id: $groupId) {
    id
    title
  }
}

# BoardGroupArchive archives a group in a board.
mutation BoardGroupArchive($boardId: ID!, $groupId: String!) {
  archive_group(board_id: $boardId, group_id: $groupId) {
    id
    title
  }
}

# BoardGroupRename renames a group in a board.
mutation BoardGroupRename($boardId: ID!, $groupId: String!, $name: String!) {
  update_group(board_id: $boardId, group_id: $groupId, group_attribute: title, new_value: $name) {
    id
    title
    color
    position
  }
}

# BoardColumnList fetches the columns of a board.
query BoardColumnList($boardId: ID!) {
  boards(ids: [$boardId]) {
    id
    columns {
      id
      title
      type
      settings_str
      width
      archived
    }
  }
}

# BoardColumnCreate creates a new column in a board.
mutation BoardColumnCreate(
  $boardId: ID!,
  $title: String!,
  $columnType: ColumnType!,
  # @genqlient(omitempty: true)
  $description: String,
  # @genqlient(omitempty: true)
  $defaults: JSON,
) {
  create_column(board_id: $boardId, title: $title, column_type: $columnType, description: $description, defaults: $defaults) {
    id
    title
    type
    settings_str
    width
    archived
  }
}

# BoardColumnDelete deletes a column from a board.
mutation BoardColumnDelete($boardId: ID!, $columnId: String!) {
  delete_column(board_id: $boardId, column_id: $columnId) {
    id
    title
  }
}

# BoardColumnRename renames a column in a board.
mutation BoardColumnRename($boardId: ID!, $columnId: String!, $title: String!) {
  change_column_title(board_id: $boardId, column_id: $columnId, title: $title) {
    id
    title
    type
    settings_str
    width
    archived
  }
}

# BoardColumnDescribe updates the description of a column.
mutation BoardColumnDescribe($boardId: ID!, $columnId: String!, $description: String!) {
  change_column_metadata(board_id: $boardId, column_id: $columnId, column_property: description, value: $description) {
    id
    title
    type
    settings_str
    width
    archived
  }
}
